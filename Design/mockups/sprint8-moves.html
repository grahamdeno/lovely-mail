<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Lovely: card moves (Dot)</title>
<style>
:root{--blue:#2E58C8;--bone:#FFFDF8;--rose:#D2546E;--bg:#FBF8F4;--toast:rgba(30,27,36,.82)}
.dark{--blue:#5B7FE8;--bg:#17161A;--toast:rgba(20,18,24,.86)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#E9E4DE;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center}
#phone{position:relative;width:390px;height:844px;border-radius:48px;overflow:hidden;background:var(--bg);color:var(--bone);box-shadow:0 30px 80px rgba(0,0,0,.25);touch-action:none}
@media (max-width:520px){body{display:block}#phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

/* Glass */
.glass{background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);
  border:1px solid rgba(255,255,255,.32);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 30px rgba(20,16,30,.18)}
.dark .glass{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.18)}

/* Pages: one email, full screen */
#stack{position:absolute;inset:0}
.page{position:absolute;inset:0;overflow:hidden;will-change:transform;transform-origin:50% 100%;user-select:none;-webkit-user-select:none}
.page.ghost{transform:scale(.94);opacity:0;pointer-events:none}
.atmo{position:absolute;inset:-25%;animation:drift 16s ease-in-out infinite alternate}
.dark .atmo{filter:brightness(.55) saturate(1.15)}
@keyframes drift{0%{transform:translate(0,0) rotate(0) scale(1)}50%{transform:translate(4%,-3%) rotate(8deg) scale(1.06)}100%{transform:translate(-3%,4%) rotate(-6deg) scale(1.02)}}
.grain{position:absolute;inset:0;opacity:.18;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.hero{position:absolute;left:24px;right:24px;top:calc(108px + env(safe-area-inset-top))}
.hero .k{font-size:15px;font-weight:600;letter-spacing:.3px;opacity:.85}
.hero .v{font-size:68px;font-weight:800;letter-spacing:-2px;line-height:1;margin-top:6px;text-shadow:0 2px 24px rgba(20,16,30,.18)}
.hero .s{font-size:17px;font-weight:500;opacity:.85;margin-top:8px}
.panel{position:absolute;left:14px;right:14px;bottom:var(--panelBottom);border-radius:26px;padding:16px 18px 14px}
.who{display:flex;align-items:center;gap:11px}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;background:rgba(255,255,255,.24);flex:none}
.who .n{font-weight:600;font-size:16px}
.who .a{font-size:12.5px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.who .t{margin-left:auto;font-size:13px;opacity:.75;align-self:flex-start}
.subj{font-size:21px;font-weight:700;line-height:1.2;margin:14px 0 6px;letter-spacing:-.2px}
.sum{font-size:16px;line-height:1.4;opacity:.92}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25)}
.chip.d{background:rgba(255,255,255,.9);border-color:transparent}
.open{font-size:15px;font-weight:600;margin-top:12px;opacity:.95}
#trash{position:absolute;top:0;bottom:0;right:0;width:112px;background:var(--rose);color:#fff;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2;opacity:0}

/* Top */
.top{position:absolute;left:0;right:0;top:0;padding:calc(14px + env(safe-area-inset-top)) 16px 0;display:flex;align-items:center;gap:8px;z-index:5;pointer-events:none}
.top>*{pointer-events:auto}
.word{font-size:14px;font-weight:600;padding:8px 13px;border-radius:999px}
.top .x{font-size:18px;padding:6px 13px}
.top .sp{flex:1}
#count{font-variant-numeric:tabular-nums}
.prog{position:absolute;left:16px;right:16px;top:calc(56px + env(safe-area-inset-top));height:3px;border-radius:2px;background:rgba(255,255,255,.25);z-index:5;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--bone);transition:width .4s}
#hintUp{position:absolute;left:0;right:0;top:calc(72px + env(safe-area-inset-top));text-align:center;z-index:5;opacity:0;pointer-events:none}
#hintUp span{display:inline-block}

/* Bottom: button, ask, words beside the dot */
#bottom{position:absolute;left:0;right:0;bottom:0;z-index:5;pointer-events:none;transition:opacity .2s}
#bottom>*{pointer-events:auto}
#main{display:none;position:absolute;left:14px;right:14px;bottom:158px;min-height:54px;border-radius:18px;background:var(--blue);color:#fff;font-weight:600;font-size:17px;box-shadow:0 8px 24px rgba(20,16,30,.25)}
.showmain #main{display:block}
.ask{position:absolute;left:14px;right:14px;bottom:96px;display:flex;gap:8px;align-items:center;border-radius:20px;padding:5px 5px 5px 14px}
.ask input{flex:1;height:40px;border:0;background:none;color:var(--bone);font-size:16px;outline:none}
.ask input::placeholder{color:rgba(255,253,248,.72)}
.ask .go{width:38px;height:38px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 2px 8px rgba(20,16,30,.25)}
.side{position:absolute;bottom:20px;font-size:15px;font-weight:600}
.side.l{left:18px}.side.r{right:18px;display:flex;gap:8px}

/* The dot */
#dotWrap{position:absolute;left:50%;bottom:18px;width:0;height:0;z-index:6;pointer-events:none}
#blob{position:absolute;left:-150px;top:-150px;width:300px;height:300px;overflow:visible}
#ripple{position:absolute;left:-54px;top:-54px;width:108px;height:108px;border-radius:50%;border:2px solid var(--blue);opacity:0}
@keyframes ripple{from{transform:scale(1);opacity:.55}to{transform:scale(2.6);opacity:0}}
#dest{position:absolute;left:0;right:0;bottom:158px;text-align:center;z-index:6;pointer-events:none;opacity:0}
#dest span{display:inline-block;font-size:15px;font-weight:600;padding:9px 16px;border-radius:999px;transition:background .15s,color .15s}
#dest.hit span{background:var(--bone);color:var(--c)}

/* Toast */
#toast{position:absolute;left:14px;right:14px;top:calc(70px + env(safe-area-inset-top));background:var(--toast);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;border-radius:16px;
  padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:15px;transform:translateY(-10px);opacity:0;pointer-events:none;transition:all .25s;overflow:hidden;z-index:8}
#toast.on{transform:none;opacity:1;pointer-events:auto}
#toast .u{margin-left:auto;font-weight:700;color:#A9BEFF}
#toast .bar10{position:absolute;left:0;bottom:0;height:3px;background:#A9BEFF;width:100%}

/* Drawer sheet */
#sheet{position:absolute;inset:0;background:rgba(20,16,30,.3);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
#sheet.on{opacity:1;pointer-events:auto}
#sheet .pan{width:100%;border-radius:28px 28px 0 0;padding:18px 14px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.9,.3,1);background:rgba(40,36,50,.55)}
#sheet.on .pan{transform:none}
#sheet h3{margin:0 0 4px;font-size:17px;text-align:center}
#sheet p{margin:0 0 14px;font-size:13px;opacity:.8;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid button{border-radius:16px;padding:14px 12px;font-weight:600;font-size:15px;text-align:left;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2)}
.grid i{width:10px;height:10px;border-radius:50%;flex:none}
#sheet .cancel{display:block;margin:14px auto 0;font-weight:600}

#wrap{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;overflow:hidden}
#wrap.on{display:flex}
#wrap>*{position:relative}
#wrap .atmo{position:absolute}
#wrap h2{margin:6px 0 0;font-size:26px}
#wrap .st{opacity:.85;font-size:15px;line-height:1.6}
#wrap button{margin-top:14px;font-weight:600;border-radius:18px;padding:14px 28px}
#coach{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:7;transition:opacity .4s}
#coach div{border-radius:18px;padding:14px 18px;font-size:14px;line-height:1.7;background:var(--toast)}
</style>
</head>
<body>
<div id="phone">
  <div id="stack">
    <div id="trash">Move to<br>Trash</div>
    <div id="next" class="page ghost"></div>
    <div id="page" class="page"></div>
    <div id="wrap">
      <div class="atmo" style="background:radial-gradient(40% 35% at 30% 30%,#7FA0F0,transparent),radial-gradient(45% 40% at 75% 65%,#9C8CF0,transparent),linear-gradient(160deg,#2E58C8,#2B2F7A)"></div>
      <svg width="72" height="72" viewBox="0 0 100 100"><path d="M27 72C38 70 56 55 59 38C61 26 52 20 46 27C39 35 41 58 46 68C49 75 57 77 66 71" fill="none" stroke="#fff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="74" cy="64" r="4.8" fill="#fff"/></svg>
      <h2>All clear</h2>
      <div class="st" id="stats"></div>
      <button id="again" class="glass">Go again</button>
    </div>
  </div>

  <div class="top">
    <button class="word glass x" aria-label="Close">×</button>
    <span class="sp"></span>
    <button class="word glass" id="tDark">Dark</button>
    <button class="word glass" id="tMain">Button</button>
    <span class="word glass" id="count">1 of 6</span>
  </div>
  <div class="prog"><i id="progBar"></i></div>
  <div id="hintUp"><span class="word glass" id="hintText">Skip for now</span></div>
  <div id="coach"><div>Flick up: skip for now<br>Pull down into the dot: put away<br>Swipe left: Trash<br>Tap: open</div></div>

  <div id="bottom">
    <button id="main">Put away in Money</button>
    <form class="ask glass" id="askForm">
      <input id="ask" placeholder="Ask Lovely about this email" autocomplete="off">
      <button class="go" aria-label="Ask"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </form>
    <button class="side l word glass" data-t="Archived">Archive</button>
    <div class="side r"><button class="word glass" data-t="More: Keep 2 weeks, always put away, screen out, text someone">⋯</button></div>
  </div>

  <div id="dest"><span class="glass" id="destText"></span></div>
  <div id="dotWrap"><div id="ripple"></div><svg id="blob" viewBox="-150 -150 300 300"><path id="blobPath" fill="var(--blue)"/></svg></div>

  <div id="toast"><span id="toastText"></span><button class="u" id="undo">Undo</button><span class="bar10" id="toastBar"></span></div>

  <div id="sheet"><div class="pan glass">
    <h3>Choose a drawer</h3><p>Lovely puts it away there and remembers this sender.</p>
    <div class="grid" id="grid"></div>
    <button class="cancel" id="cancelSheet">Cancel</button>
  </div></div>
</div>

<script>
(() => {
const ITEMS = [
 {from:'Cape Fear Power',addr:'billing@capefearpower.example',time:'8:14 AM',subject:'Your November bill is ready',summary:'About 9% higher than October. Autopay is off.',k:'Due Nov 21',v:'$142.18',s:'Electric bill',drawer:'Money',tags:['bill','electric','house'],act:'put',pal:'Money'},
 {from:'Pine Valley Middle',addr:'office@pinevalley.example',time:'7:02 AM',subject:'Band trip permission slip',summary:'Sign and return the form for the Dec 6 trip to Raleigh.',k:'Due',v:'Friday',s:'Permission slip to sign',drawer:'Kids and family',tags:['school','form','band'],act:'put',pal:'Kids and family'},
 {from:'Sarah Mills',addr:'sarah.mills@example.com',time:'Yesterday',subject:'Dinner Saturday?',summary:'They finally have a sitter and want to try the new place downtown.',k:'Waiting on you',v:'Sat 7 PM',s:'Dinner with Sarah',drawer:'Personal',tags:['plans'],act:'reply',pal:'Personal'},
 {from:'Parcel Post',addr:'updates@parcelpost.example',time:'Yesterday',subject:'Delivered: 1 package',summary:'Left at the front door.',k:'Delivered',v:'4:41 PM',s:'Front door',drawer:'Orders',tags:['delivery'],act:'put',pal:'Orders'},
 {from:'The Morning Edit',addr:'hello@morningedit.example',time:'Mon',subject:'Five things worth reading',summary:'Weekly newsletter. You usually archive these.',k:'Newsletter',v:'5 reads',s:'Paper planners, winter coats, postcards',drawer:null,tags:['newsletter'],act:'archive',pal:'Archive'},
 {from:'Hearth & Co',addr:'quotes@hearthco.example',time:'Mon',subject:'Your chimney quote is ready',summary:'Quote for an inspection and cleaning. Reply to schedule.',k:'New sender',v:'Quote',s:'Chimney inspection',drawer:null,tags:[],act:'choose',pal:'New'}
];
const COLORS={'Money':'#2E8B57','Kids and family':'#C27C0E','Personal':'#D2546E','Orders':'#2E58C8','Home':'#1F8A8A','Work and career':'#6B5CC4','Projects and business':'#8A5A2E','Accounts and security':'#5E5962','Travel':'#2E86C1','Health':'#B5487A','Archive':'#5E5962'};
// Each email's ground: a slow-moving wash in its drawer's color, never a photo.
const PAL={
 'Money':['#1F6B47','#3FA772','#9AD7A9','#E9D79A'],
 'Kids and family':['#8A5208','#D9952A','#F2C46B','#E98A5A'],
 'Personal':['#8E2F4A','#D2546E','#F0A2AE','#F2B98A'],
 'Orders':['#213F96','#2E58C8','#7FA0F0','#8FD3E8'],
 'Archive':['#3E3A44','#6F6A75','#A9A3AC','#C9B9A6'],
 'New':['#2B2F7A','#5B4FD0','#9C8CF0','#E08FC2']
};
const ground = p => { const c=PAL[p]; return `radial-gradient(38% 32% at 22% 28%,${c[2]},transparent 70%),radial-gradient(42% 36% at 82% 18%,${c[3]},transparent 70%),radial-gradient(50% 45% at 70% 78%,${c[1]},transparent 70%),radial-gradient(45% 40% at 18% 85%,${c[2]}cc,transparent 70%),linear-gradient(165deg,${c[1]},${c[0]})`; };
const UP=100, DOWN=170, TW=112, R0=54;

const $=id=>document.getElementById(id);
const phone=$('phone'), page=$('page'), next=$('next'), trash=$('trash');
let idx=0, stats={put:0,skip:0,trash:0}, history=[], busy=false;
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const panelBottom=()=>phone.classList.contains('showmain')?'224px':'158px';

function dest(it,chosen){
  if(chosen) return {label:'Put away in '+chosen,color:COLORS[chosen]};
  if(it.act==='archive') return {label:'Archive',color:COLORS.Archive};
  if(it.act==='choose') return {label:'Choose a drawer',color:'#5B4FD0',choose:true};
  return {label:'Put away in '+it.drawer,color:COLORS[it.drawer]};
}
function html(it){
  const ini=it.from.split(/\s+/).map(w=>w[0]).slice(0,2).join('');
  const c=it.drawer?COLORS[it.drawer]:null;
  return `<div class="atmo" style="background:${ground(it.pal)}"></div><div class="grain"></div>
   <div class="hero"><div class="k">${esc(it.k)}</div><div class="v">${esc(it.v)}</div><div class="s">${esc(it.s)}</div></div>
   <div class="panel glass" style="--panelBottom:${panelBottom()}">
    <div class="who"><div class="av">${esc(ini)}</div><div><div class="n">${esc(it.from)}</div><div class="a">${esc(it.addr)}</div></div><div class="t">${esc(it.time)}</div></div>
    <div class="subj">${esc(it.subject)}</div><div class="sum">${esc(it.summary)}</div>
    <div class="chips">${c?`<span class="chip d" style="color:${c}">${esc(it.drawer)}</span>`:''}${it.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>
    <div class="open">Open the email ›</div></div>`;
}
function render(){
  const done=idx>=ITEMS.length;
  $('count').textContent=done?'Done':`${idx+1} of ${ITEMS.length}`;
  $('progBar').style.width=(idx/ITEMS.length*100)+'%';
  $('wrap').classList.toggle('on',done);
  page.style.display=done?'none':'';
  $('bottom').style.display=done?'none':'';
  if(done){ $('stats').innerHTML=`${ITEMS.length} gone through<br>${stats.put} put away · ${stats.skip} skipped · ${stats.trash} in Trash`; return; }
  page.innerHTML=html(ITEMS[idx]);
  next.innerHTML=idx+1<ITEMS.length?html(ITEMS[idx+1]):'';
  const it=ITEMS[idx]; $('main').textContent=it.act==='reply'?'Reply':dest(it).label;
  clearDest();
}

/* ---------- the dot: a drop of water ---------- */
const path=$('blobPath');
const B={s:1,sv:0,sT:1,reach:0,modes:[2,3,4,5,6].map(k=>({k,a:0,v:0,ph:Math.random()*6.28})),t:0};
function kick(strength){
  B.sv+=strength*3.2;
  B.modes.forEach(m=>{ m.v+=(Math.random()*2-1)*strength*(1.6/m.k)*2.2; m.ph=Math.random()*6.28; });
  const r=$('ripple'); r.style.animation='none'; void r.offsetWidth; r.style.animation='ripple .9s ease-out';
}
let lastF=performance.now();
function frame(now){
  const dt=Math.min(.033,(now-lastF)/1000); lastF=now; B.t+=dt;
  // scale spring, underdamped so it overshoots like water
  const w=13, z=.28; B.sv+=(-w*w*(B.s-B.sT)-2*z*w*B.sv)*dt; B.s+=B.sv*dt;
  B.modes.forEach(m=>{ const wk=9+m.k*2.4, zk=.16; m.v+=(-wk*wk*m.a-2*zk*wk*m.v)*dt; m.a+=m.v*dt; });
  const N=120; let d='';
  for(let i=0;i<=N;i++){
    const th=i/N*Math.PI*2;
    let r=1+Math.sin(B.t*1.3+th*3)*.006; // a faint breath at rest
    B.modes.forEach(m=>{ r+=m.a*Math.cos(m.k*th+m.ph); });
    const up=Math.max(0,-Math.sin(th)); r+=B.reach*.22*up*up*up; // reaches up toward the email
    const R=R0*B.s*r, x=Math.cos(th)*R, y=Math.sin(th)*R;
    d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);
  }
  path.setAttribute('d',d+'Z');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function setDest(p){
  const it=ITEMS[idx]; if(!it) return;
  const d=dest(it), hit=p>=1;
  B.sT=1+Math.min(p,1.25)*.7; B.reach=Math.min(p,1.2)*(hit?1:.7);
  const el=$('dest'); el.style.opacity=Math.min(1,p*1.8); el.classList.toggle('hit',hit); el.style.setProperty('--c',d.color);
  $('destText').textContent=hit?(d.choose?'Let go to choose a drawer':'Let go: '+d.label):d.label;
  $('bottom').style.opacity=Math.max(0,1-p*1.6);
}
function clearDest(){ B.sT=1; B.reach=0; $('dest').style.opacity=0; $('dest').classList.remove('hit'); $('bottom').style.opacity=1; }

/* ---------- transforms ---------- */
let drag=0, slide=0;
const resisted=v=>{const a=Math.abs(v),s=v<0?-1:1;return s*(a<=40?a:40+(a-40)*.5);};
function place(t){
  const p=Math.max(0,drag)/DOWN;
  page.style.transition=t||'none';
  page.style.transform=`translate(${slide}px,${resisted(drag)}px) scale(${1-Math.min(p,1.3)*.12})`;
  page.style.borderRadius=(drag>0?Math.min(44,p*44):(drag<0?Math.min(44,-drag/3):0))+'px';
  next.style.transition=t||'none'; next.style.opacity=(drag!==0&&slide===0)?.75:0;
  trash.style.opacity=Math.min(1,-slide/TW); trash.style.width=Math.max(TW,-slide)+'px';
  const up=Math.max(0,-drag)/UP;
  $('hintUp').style.opacity=Math.min(1,up); $('hintText').textContent=up>=1?'Back next session':'Skip for now';
  if(drag>=0) setDest(p);
}

/* ---------- gesture ---------- */
let down=false,x0=0,y0=0,dir=null,slideStart=0,t0=0,vy=0,vx=0,lastT=0,lastDY=0,lastDX=0,crossed=0;
const tick=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}};
page.addEventListener('pointerdown',e=>{
  if(busy) return; page.setPointerCapture(e.pointerId);
  down=true;x0=e.clientX;y0=e.clientY;dir=null;slideStart=slide;t0=lastT=performance.now();vy=vx=0;lastDY=lastDX=0;hideCoach();
});
page.addEventListener('pointermove',e=>{
  if(!down||busy) return;
  const dx=e.clientX-x0, dy=e.clientY-y0, now=performance.now();
  if(now>lastT){vy=(dy-lastDY)/(now-lastT);vx=(dx-lastDX)/(now-lastT);lastT=now;lastDY=dy;lastDX=dx;}
  if(Math.abs(dx)<6&&Math.abs(dy)<6) return;
  if(dir===null) dir=(Math.abs(dx)>Math.abs(dy)*1.5&&(dx<0||slideStart<0))?'side':'vert';
  if(dir==='side'){
    const x=Math.min(0,slideStart+dx), before=slide<=-TW*.6;
    slide=x>=-TW?x:-TW+(x+TW)*.35; if(slide<=-TW*.6&&!before) tick();
    place(); return;
  }
  if(slideStart<0) return;
  drag=dy;
  const c=-dy>=UP?1:(dy>=DOWN?-1:0); if(c!==crossed){ if(c){tick(); if(c===-1) kick(.12);} crossed=c; }
  place();
});
function end(e){
  if(!down) return; down=false; crossed=0; if(busy) return;
  const dx=e.clientX-x0, dy=e.clientY-y0;
  if(dir==='side'){ const open=slideStart+dx+vx*120<=-TW*.5; slide=open?-TW:0; place('transform .35s cubic-bezier(.3,1.25,.6,1)'); return; }
  if(slideStart<0||slide<0){ slide=0;drag=0; place('transform .35s cubic-bezier(.3,1.25,.6,1), border-radius .35s'); clearDest(); return; }
  if(Math.abs(dy)<6&&Math.abs(dx)<6&&performance.now()-t0<350){ toast('Opens the full email',false); return; }
  if(dy<=-UP||(dy+vy*90<=-UP&&dy<-30)) skip();
  else if(dy>=DOWN) file();
  else { drag=0; place('transform .45s cubic-bezier(.34,1.4,.64,1), border-radius .45s'); clearDest(); }
}
page.addEventListener('pointerup',end); page.addEventListener('pointercancel',end);
trash.addEventListener('click',()=>{ if(slide<0&&!busy) doTrash(); });

/* ---------- moves ---------- */
function dotCenter(){ const r=$('dotWrap').getBoundingClientRect(); return {x:r.left,y:r.top}; }
function skip(){
  busy=true; const h=phone.getBoundingClientRect().height;
  page.style.transition='transform .32s ease-in, opacity .32s, border-radius .32s';
  page.style.transform=`translate(0,${-h*1.05}px) scale(.96)`; page.style.opacity=0; page.style.borderRadius='44px';
  $('hintUp').style.opacity=0;
  kick(.35);
  history.push({i:idx,kind:'skip'}); stats.skip++;
  setTimeout(()=>advance('Skipped. Back next session'),320);
}
function file(chosen){
  const it=ITEMS[idx], d=dest(it,chosen);
  if(d.choose&&!chosen){ drag=0; place('transform .45s cubic-bezier(.34,1.4,.64,1), border-radius .45s'); clearDest(); openSheet(); return; }
  busy=true;
  const pr=page.getBoundingClientRect(), c=dotCenter();
  const ox=pr.left+pr.width/2, oy=pr.top+pr.height; // the page shrinks from its bottom center
  page.style.transition='transform .36s cubic-bezier(.55,0,.75,.45), opacity .36s, border-radius .36s';
  page.style.transform=`translate(${c.x-ox+slide}px,${c.y-oy+resisted(drag)}px) scale(.02)`;
  page.style.opacity=.4; page.style.borderRadius='400px';
  B.sT=1.55; B.reach=0;
  $('dest').classList.add('hit'); $('destText').textContent=d.label;
  setTimeout(()=>{ tick(); B.sT=1; kick(1); $('dest').style.opacity=0; },340);
  history.push({i:idx,kind:'put'}); stats.put++;
  setTimeout(()=>advance(d.label),520);
}
function doTrash(){
  busy=true; const w=phone.getBoundingClientRect().width;
  slide=-w*1.15; place('transform .25s ease-in'); page.style.transition+=', opacity .25s'; page.style.opacity=0;
  history.push({i:idx,kind:'trash'}); stats.trash++;
  setTimeout(()=>advance('Moved to Trash'),260);
}
function advance(msg){
  idx++; drag=0; slide=0;
  page.style.transition='none'; page.style.borderRadius='44px'; page.style.opacity=0;
  render();
  if(idx<ITEMS.length){
    // The next email comes up out of the dot.
    const c=dotCenter(), pr=phone.getBoundingClientRect();
    page.style.transform=`translate(${c.x-(pr.left+pr.width/2)}px,${c.y-pr.bottom}px) scale(.04)`;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      page.style.transition='transform .55s cubic-bezier(.25,1.15,.5,1), opacity .25s, border-radius .55s';
      page.style.transform='none'; page.style.opacity=1; page.style.borderRadius='0px';
    }));
  }
  trash.style.opacity=0; next.style.opacity=0;
  setTimeout(()=>{busy=false;},200);
  toast(msg,true);
}

/* ---------- toast and undo ---------- */
let tt=null;
function toast(msg,undoable){
  $('toastText').textContent=msg; $('undo').style.display=undoable?'':'none';
  const b=$('toastBar'); b.style.transition='none'; b.style.width='100%'; b.style.display=undoable?'':'none';
  $('toast').classList.add('on');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{b.style.transition=`width ${undoable?10:2}s linear`;b.style.width='0%';}));
  clearTimeout(tt); tt=setTimeout(()=>$('toast').classList.remove('on'),undoable?10000:1800);
}
$('undo').addEventListener('click',()=>{
  const h=history.pop(); if(!h||busy) return;
  stats[h.kind]--; idx=h.i; drag=0; slide=0;
  page.style.transition='none'; page.style.opacity=0; page.style.transform='scale(.92)';
  render(); kick(.25);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{page.style.transition='transform .45s cubic-bezier(.3,1.25,.6,1), opacity .3s';page.style.transform='none';page.style.opacity=1;page.style.borderRadius='0px';}));
  $('toast').classList.remove('on');
});

/* ---------- drawer sheet ---------- */
const DRAWERS=['Money','Home','Kids and family','Health','Work and career','Projects and business','Orders','Travel','Personal','Accounts and security'];
$('grid').innerHTML=DRAWERS.map(d=>`<button data-d="${d}"><i style="background:${COLORS[d]}"></i>${d}</button>`).join('');
const openSheet=()=>$('sheet').classList.add('on'), closeSheet=()=>$('sheet').classList.remove('on');
$('grid').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; closeSheet(); setTimeout(()=>file(b.dataset.d),280);});
$('cancelSheet').addEventListener('click',closeSheet);
$('sheet').addEventListener('click',e=>{ if(e.target.id==='sheet') closeSheet(); });

/* ---------- controls ---------- */
$('main').addEventListener('click',()=>{ if(busy||idx>=ITEMS.length) return; if(ITEMS[idx].act==='reply'){toast('Opens the reply',false);return;} file(); });
document.querySelectorAll('[data-t]').forEach(b=>b.addEventListener('click',()=>toast(b.dataset.t,false)));
$('askForm').addEventListener('submit',e=>{e.preventDefault();const v=$('ask').value.trim();$('ask').value='';$('ask').blur();toast(v?'Ask Lovely answers here':'Type a question first',false);});
$('again').addEventListener('click',()=>{idx=0;history=[];stats={put:0,skip:0,trash:0};page.style.opacity=1;page.style.transform='none';render();kick(.5);});
$('tDark').addEventListener('click',()=>{const on=phone.classList.toggle('dark');$('tDark').textContent=on?'Light':'Dark';});
$('tMain').addEventListener('click',()=>{const on=phone.classList.toggle('showmain');$('tMain').textContent=on?'No button':'Button';
  document.querySelectorAll('.panel').forEach(p=>p.style.setProperty('--panelBottom',panelBottom()));});
let coachGone=false; function hideCoach(){ if(coachGone) return; coachGone=true; $('coach').style.opacity=0; }
setTimeout(hideCoach,4500);

render();
setTimeout(()=>kick(.6),400);
})();
</script>
</body>
