name: build

on:
  pull_request:
  push:
    branches: [main, 'redesign/**']

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Privacy guard
        run: |
          if grep -rnE 'gmail\.send|gmail\.compose|gmail\.modify|mail\.google\.com/"|messages/send|drafts/send|/send\?|\.send\(' App/Reelmail; then
            echo '::error::Reelmail must stay read-only.'
            exit 1
          fi

      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo '::error::Xcode 26 is unavailable'; exit 1; fi
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available iPhone | grep -Eo '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | head -1)
          if [ -z "$UDID" ]; then echo '::error::No available iPhone simulator'; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          mkdir -p ci-artifacts
          set -o pipefail
          xcodebuild test \
            -project Reelmail.xcodeproj \
            -scheme Reelmail \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath ci-artifacts/Reelmail.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ci-artifacts/build.log

      - name: Save validation summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p ci-artifacts
          printf 'Commit: %s\nJob status before artifact upload: %s\n' "$HEAD_SHA" "$JOB_STATUS" > ci-artifacts/validation.txt
          cat ci-artifacts/validation.txt >> "$GITHUB_STEP_SUMMARY"
          echo 'Simulator screenshots and device validation are not supplied by this workflow.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reelmail-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          retention-days: 7
          if-no-files-found: warn
