name: build

on:
  pull_request:
  push:
    branches: [main, 'redesign/**']

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Privacy guard
        run: |
          # Approved 2026-11-01: gmail.modify, used only to move one message to Trash and back.
          if grep -rnE 'gmail\.send|gmail\.compose|mail\.google\.com/"|messages/send|drafts/send|/send\?|\.send\(|batchDelete|batchModify|"DELETE"|/modify\b|/labels' App/Reelmail; then
            echo '::error::Lovely may only read mail and move a message to Trash. No sending, composing, relabeling or permanent delete.'
            exit 1
          fi
          if grep -rn 'gmail\.modify' App/Reelmail | grep -v 'App/Reelmail/Gmail/GmailConfig.swift'; then
            echo '::error::The gmail.modify scope may be named only in GmailConfig.swift.'
            exit 1
          fi

      - name: Release config self-test
        run: python3 -I scripts/gmail_release_config.py selftest

      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo '::error::Xcode 26 is unavailable'; exit 1; fi
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available iPhone | grep -Eo '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | head -1)
          if [ -z "$UDID" ]; then echo '::error::No available iPhone simulator'; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          mkdir -p ci-artifacts
          set -o pipefail
          xcodebuild test \
            -project Reelmail.xcodeproj \
            -scheme Reelmail \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath ci-artifacts/Reelmail.xcresult \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ci-artifacts/build.log

      - name: Verify app icon and name in the built app
        run: |
          APP=$(find build/dd/Build/Products -maxdepth 2 -name 'Reelmail.app' | head -1)
          python3 -I scripts/gmail_release_config.py verify-icon "$APP"

      - name: Export screenshot attachments
        if: ${{ !cancelled() && hashFiles('ci-artifacts/Reelmail.xcresult/Info.plist') != '' }}
        run: |
          mkdir -p ci-artifacts/screenshots
          xcrun xcresulttool export attachments --help > ci-artifacts/attachment-export-help.txt
          set -o pipefail
          xcrun xcresulttool export attachments \
            --path ci-artifacts/Reelmail.xcresult \
            --output-path ci-artifacts/screenshots \
            2>&1 | tee ci-artifacts/attachment-export.log
          python3 - <<'PY'
          from pathlib import Path
          from html import escape
          import json
          root = Path('ci-artifacts/screenshots')
          images = sorted(p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.png', '.jpg', '.jpeg'})
          if not images:
              raise SystemExit('No screenshot images were exported; inspect the result bundle and export log.')
          entries = []
          cards = []
          for p in images:
              relative = p.relative_to(root).as_posix()
              entries.append(relative)
              cards.append('<figure><img src="' + escape(relative, quote=True) + '" alt="Captured demo interface"><figcaption>' + escape(relative) + '</figcaption></figure>')
          page = '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reelmail demo captures</title><style>body{font:16px system-ui;background:#f7f6f2;color:#202827;margin:24px}main{display:flex;flex-wrap:wrap;gap:24px}figure{margin:0;max-width:393px}img{width:100%;height:auto}figcaption{overflow-wrap:anywhere;padding:12px 0}</style><h1>Reelmail demo captures</h1><p>Fictional mail. Captures are evidence of rendering, not visual approval. This gallery is a downloaded artifact, not a hosted website.</p><main>' + ''.join(cards) + '</main></html>'
          (root / 'index.html').write_text(page)
          (root / 'images.json').write_text(json.dumps(entries, indent=2))
          with open('ci-artifacts/screenshot-summary.txt', 'w') as f:
              f.write(str(len(images)) + ' exported image attachments. Visual review pending.\n')
          PY

      - name: Print demo screenshots for remote review
        # Fictional demo data only. Lets a reviewer without artifact access read the captures from the job log.
        if: ${{ !cancelled() && hashFiles('ci-artifacts/screenshots/images.json') != '' }}
        run: |
          for f in $(find ci-artifacts/screenshots -name '*.png' | sort); do
            out="${RUNNER_TEMP}/shot.jpg"
            sips -s format jpeg -s formatOptions 55 --resampleWidth 390 "$f" --out "$out" >/dev/null
            echo "SHOT-BEGIN $(basename "$f")"
            base64 -i "$out" | tr -d '\n'; echo
            echo "SHOT-END"
          done

      - name: Save validation summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p ci-artifacts
          printf 'Commit: %s\nJob status before artifact upload: %s\n' "$HEAD_SHA" "$JOB_STATUS" > ci-artifacts/validation.txt
          cat ci-artifacts/validation.txt >> "$GITHUB_STEP_SUMMARY"
          if [ -f ci-artifacts/screenshot-summary.txt ]; then
            cat ci-artifacts/screenshot-summary.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No verified screenshot export is available from this run.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Device validation and visual approval remain separate.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshot gallery
        if: ${{ !cancelled() && hashFiles('ci-artifacts/screenshots/index.html') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: reelmail-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/screenshots/
          retention-days: 7
          if-no-files-found: error

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reelmail-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          retention-days: 7
          if-no-files-found: warn
